name: 'Setup Node Dependencies'
description: 'Install Node.js and pnpm dependencies'
inputs:
  skip-build:
    description: 'Skip building libraries'
    required: false
    default: 'false'
  shell:
    description: 'Shell to use (bash, pwsh)'
    required: false
    default: 'bash'
runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.30.3

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: v22.17.0
        cache: 'pnpm'
        cache-dependency-path: './pnpm-lock.yaml'

    - name: Install node dependencies
      shell: ${{ inputs.shell }}
      run: pnpm install --frozen-lockfile

    - name: Build libraries
      if: inputs.skip-build != 'true'
      shell: ${{ inputs.shell }}
      run: |
        pnpm build:graphql-docs
        pnpm build:bruno-query
        pnpm build:bruno-common
        pnpm --filter @usebruno/js sandbox:bundle-libraries
        pnpm build:bruno-converters
        pnpm build:bruno-requests
        pnpm build:schema-types
        pnpm build:bruno-filestore
