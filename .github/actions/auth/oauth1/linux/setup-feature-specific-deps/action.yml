name: 'Setup Auth Feature Dependencies - Linux'
description: 'Setup feature-specific dependencies for auth tests on Linux'
runs:
  using: 'composite'
  steps:
    - name: Install additional OS dependencies for auth tests
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y \
          libglib2.0-0 libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgtk-3-0 libasound2t64 \
          xvfb

        CHROME_SANDBOX="$(pnpm --filter pulse exec node -e "const path = require('node:path'); process.stdout.write(path.join(path.dirname(require.resolve('electron/package.json')), 'dist/chrome-sandbox'));")"
        sudo chown root "$CHROME_SANDBOX"
        sudo chmod 4755 "$CHROME_SANDBOX"
