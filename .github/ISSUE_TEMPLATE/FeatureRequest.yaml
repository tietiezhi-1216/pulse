name: 功能建议
description: 为 Pulse 提出新功能、改进或产品方向建议
labels: ['enhancement']
body:
  - type: checkboxes
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索已有 Issue，没有找到相同或高度相关的建议。
          required: true

  - type: checkboxes
    attributes:
      label: 这个功能
      options:
        - label: 会解除我当前使用 Pulse 的阻碍。
          required: false
        - label: 会明显改善 Pulse 的使用体验。
          required: false
        - label: 是我希望 Pulse 区别于其他 API 客户端的独特能力。
          required: false
        - label: 与中文化、国际化或 AI 辅助接口开发相关。
          required: false

  - type: markdown
    attributes:
      value: |
        请尽量说明使用场景，而不仅是功能名称。好的功能建议通常包含：谁会用、什么时候用、现在为什么不方便、希望 Pulse 如何改进。

  - type: textarea
    attributes:
      label: 功能描述
      description: 请描述你想添加或改进什么，以及它会如何改变你的使用方式。
    validations:
      required: true

  - type: textarea
    attributes:
      label: 参考截图、原型或链接
      description: 如果有截图、草图、竞品参考或更完整的说明，请放在这里。
    validations:
      required: false
